<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="Gabi Sánchez, concejal Profundidad, noticias Profundidad, gestión municipal Misiones">
    <meta name="description" content="Novedades y actualidad de Gabi Sánchez, concejal de Profundidad, Misiones. Actividades, gestiones y noticias del municipio.">
    <meta property="og:title" content="Novedades — Gabi Sánchez">
    <meta property="og:description" content="Actividades, gestiones y noticias del municipio de Profundidad.">
    <meta property="og:image" content="img/logo.png">
    <title>Novedades — Gabi Sánchez, Concejal de Profundidad</title>
    <link rel="icon" href="img/logo.png">
    <link rel="stylesheet" href="css/estilo.css">

    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-WRKHEKP0G1');
    </script>

    <script src="burbuja-somos.js" defer></script>

    <style>
        .novedades-hero {
            background-color: var(--azul-principal);
            color: var(--blanco);
            text-align: center;
            padding: 72px 20px 60px;
        }

        .novedades-hero h1 {
            font-family: var(--fuente-titulo);
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 700;
            margin-bottom: 12px;
        }

        .novedades-hero p {
            font-size: 1.05rem;
            opacity: 0.82;
            max-width: 520px;
            margin: 0 auto;
            line-height: 1.7;
        }

        .novedades-contenido {
            max-width: 800px;
            margin: 0 auto;
            padding: 72px 20px;
        }

        .novedad {
            background-color: var(--blanco);
            border-radius: var(--radio-md);
            box-shadow: var(--sombra-sm);
            padding: 28px 32px;
            margin-bottom: 24px;
            border-left: 4px solid var(--azul-medio);
            transition: transform var(--transicion), box-shadow var(--transicion);
        }

        .novedad:hover {
            transform: translateY(-3px);
            box-shadow: var(--sombra-md);
        }

        .novedad-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .novedad-fecha {
            font-size: 0.82rem;
            color: var(--gris-texto);
            font-weight: 500;
        }

        .novedad-categoria {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 99px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .cat-gestion { background-color: var(--azul-claro); color: var(--azul-principal); }
        .cat-propuesta { background-color: #dcfce7; color: #166534; }
        .cat-actividad { background-color: #fef9c3; color: #854d0e; }
        .cat-hcd { background-color: #fce7f3; color: #9d174d; }

        .novedad h2 {
            font-family: var(--fuente-titulo);
            font-size: 1.25rem;
            color: var(--azul-principal);
            margin-bottom: 10px;
        }

        .novedad p {
            font-size: 0.97rem;
            color: var(--gris-texto);
            line-height: 1.75;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">
        <a href="index.html">
            <img src="img/logo.png" alt="Gabi Sánchez — Concejal de Profundidad">
        </a>
    </div>

    <button class="hamburguesa" id="menuHamburguesa">
        <span></span><span></span><span></span>
    </button>

    <nav>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="quien-soy.html">¿Quién soy?</a></li>
            <li><a href="propuestas.html">Propuestas</a></li>
            <li><a href="fotogaleria.html">Fotogalería</a></li>
            <li><a href="gestiones-en-el-hcd.html">Gestiones en el HCD</a></li>
            <li><a href="novedades.html" class="activo">Novedades</a></li>
            <li><a href="contacto.html">Contacto</a></li>
        </ul>
    </nav>
</header>

<main>

<section class="novedades-hero">
    <h1>Novedades</h1>
    <p>Actividades, gestiones, recorridas y todo lo que pasa en Profundidad. Actualizado regularmente.</p>
</section>

<div class="novedades-contenido">

    <!-- CONTENEDOR AUTOMÁTICO -->
    <div id="contenedorNoticias"></div>

</div>

</main>

<footer>
    <nav class="redes">
        <a href="#"><img src="img/tiktok.png"></a>
        <a href="#"><img src="img/facebook.png"></a>
        <a href="#"><img src="img/instagram.png"></a>
        <a href="#"><img src="img/whatsapp.png"></a>
        <a href="#"><img src="img/email.png"></a>
        <a href="#"><img src="img/x.png"></a>
    </nav>

    <p id="footer-copy-gabi"></p>
</footer>

<script>
document.getElementById("footer-copy-gabi").innerHTML =
"&copy; 2023–" + new Date().getFullYear() + " Gabi Sánchez. Todos los derechos reservados.";
</script>

<script src="js/novedades.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const contenedor = document.getElementById("contenedorNoticias");

    if (!contenedor || typeof noticias === "undefined") return;

    noticias.forEach(noticia => {

        contenedor.innerHTML += `
        <article class="novedad">

            <div class="novedad-meta">
                <span class="novedad-fecha">${noticia.fecha}</span>
                <span class="novedad-categoria cat-hcd">${noticia.categoria}</span>
            </div>

            <h2>${noticia.titulo}</h2>
            <p>${noticia.resumen}</p>

            <a class="btn-primario" href="${noticia.link}">
                Leer nota completa →
            </a>

        </article>`;
    });

});
</script>

</body>
</html>
