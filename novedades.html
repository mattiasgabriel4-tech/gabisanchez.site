<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="keywords" content="Gabi Sánchez, concejal Profundidad, noticias Profundidad, gestión municipal Misiones">
    <meta name="description" content="Novedades y actualidad de Gabi Sánchez, concejal de Profundidad, Misiones. Actividades, gestiones y noticias del municipio.">

    <meta property="og:title" content="Novedades — Gabi Sánchez">
    <meta property="og:description" content="Actividades, gestiones y noticias del municipio de Profundidad.">
    <meta property="og:image" content="img/logo.png">

    <title>Novedades — Gabi Sánchez, Concejal de Profundidad</title>
    <link rel="icon" href="img/logo.png">
    <link rel="stylesheet" href="css/estilo.css">

    <script src="burbuja-somos.js" defer></script>

    <style>
        /* SOLO ajustes seguros sin romper tu CSS */
        .novedades-filtros{
            display:flex;
            gap:10px;
            flex-wrap:wrap;
            margin-bottom:20px;
        }

        .novedades-filtros input,
        .novedades-filtros select{
            padding:10px;
            border-radius:8px;
            border:1px solid #ddd;
            font-family: inherit;
        }

        .novedad-link{
            display:inline-block;
            margin-top:12px;
            color:#2b5cff;
            font-weight:600;
            text-decoration:none;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">
        <a href="index.html">
            <img src="img/logo.png" alt="Gabi Sánchez — Concejal de Profundidad">
        </a>
    </div>

    <nav>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="quien-soy.html">¿Quién soy?</a></li>
            <li><a href="propuestas.html">Propuestas</a></li>
            <li><a href="fotogaleria.html">Fotogalería</a></li>
            <li><a href="gestiones-en-el-hcd.html">Gestiones en el HCD</a></li>
            <li><a class="activo" href="novedades.html">Novedades</a></li>
            <li><a href="contacto.html">Contacto</a></li>
        </ul>
    </nav>
</header>

<main>

<section class="novedades-hero">
    <h1>Novedades</h1>
    <p>Actividades, gestiones, recorridas y todo lo que pasa en Profundidad.</p>
</section>

<div class="novedades-contenido">

    <div class="novedades-filtros">
        <input id="buscador" type="text" placeholder="Buscar novedades...">

        <select id="filtroCategoria">
            <option value="TODAS">Todas</option>
            <option value="HCD">HCD</option>
            <option value="GESTION">Gestión</option>
            <option value="ACTIVIDAD">Actividad</option>
        </select>
    </div>

    <div id="contenedorNovedades"></div>

</div>

</main>

<footer>
    <p id="footer-copy-gabi"></p>
</footer>

<script>
document.getElementById("footer-copy-gabi").innerHTML =
"&copy; 2023–" + new Date().getFullYear() + " Gabi Sánchez. Todos los derechos reservados.";

let novedades = JSON.parse(localStorage.getItem("novedades")) || [];

/* orden correcto */
novedades.sort((a, b) => new Date(b.fecha) - new Date(a.fecha));

const contenedor = document.getElementById("contenedorNovedades");
const buscador = document.getElementById("buscador");
const filtroCategoria = document.getElementById("filtroCategoria");

function render(lista){

    contenedor.innerHTML = "";

    if(!lista.length){
        contenedor.innerHTML = `
            <div class="novedades-vacio">
                <span class="icono">📰</span>
                <h3>No hay novedades publicadas</h3>
            </div>
        `;
        return;
    }

    lista.forEach(n => {

        contenedor.innerHTML += `
            <article class="novedad">

                <div class="novedad-meta">
                    <span class="novedad-fecha">${n.fechaTexto}</span>
                    <span class="novedad-categoria">${n.categoria}</span>
                </div>

                <h2>${n.titulo}</h2>

                <p>${n.bajada}</p>

                ${n.imagen ? `<img src="${n.imagen}" alt="${n.titulo}">` : ""}

                ${n.link ? `
                    <a class="novedad-link" href="${n.link}">
                        Leer nota completa →
                    </a>
                ` : ""}

            </article>
        `;
    });
}

function filtrar(){

    const texto = buscador.value.toLowerCase();
    const cat = filtroCategoria.value;

    const filtrado = novedades.filter(n => {

        const okTexto =
            n.titulo.toLowerCase().includes(texto) ||
            n.bajada.toLowerCase().includes(texto);

        const okCat = (cat === "TODAS") || (n.categoria === cat);

        return okTexto && okCat;
    });

    render(filtrado);
}

buscador.addEventListener("input", filtrar);
filtroCategoria.addEventListener("change", filtrar);

render(novedades);
</script>

</body>
</html>
