    <style>

        /* ---- Hero ---- */
        .galeria-hero {
            background-color: var(--azul-principal);
            color: var(--blanco);
            text-align: center;
            padding: 72px 20px 60px;
        }

        .galeria-hero h1 {
            font-family: var(--fuente-titulo);
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 700;
            margin-bottom: 16px;
        }

        .galeria-hero p {
            font-size: 1.05rem;
            max-width: 560px;
            margin: 0 auto;
            opacity: 0.82;
            line-height: 1.7;
        }

        /* ---- Contenedor galería ---- */
        .galeria-contenido {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        /* ---- Grid de fotos ---- */
        .galeria-grid {
            columns: 4 200px;
            column-gap: 12px;
        }

        .galeria-item {
            break-inside: avoid;
            margin-bottom: 12px;
            border-radius: var(--radio-sm);
            overflow: hidden;
            cursor: pointer;
            position: relative;
        }

        .galeria-item img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .galeria-item:hover img {
            transform: scale(1.03);
            filter: brightness(0.88);
        }

        /* ---- Lightbox ---- */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 200;
            background-color: rgba(0, 0, 0, 0.92);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .lightbox.activo {
            display: flex;
        }

        .lightbox-img {
            max-width: 92vw;
            max-height: 88vh;
            border-radius: var(--radio-sm);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
            object-fit: contain;
        }

        .lightbox-cerrar {
            position: absolute;
            top: 20px;
            right: 28px;
            color: var(--blanco);
            font-size: 2rem;
            cursor: pointer;
            background: none;
            border: none;
            line-height: 1;
            opacity: 0.8;
            transition: opacity var(--transicion);
            padding: 8px;
        }

        .lightbox-cerrar:hover {
            opacity: 1;
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: var(--blanco);
            font-size: 2rem;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.10);
            border: none;
            padding: 14px 18px;
            border-radius: var(--radio-sm);
            opacity: 0.8;
            transition: opacity var(--transicion), background-color var(--transicion);
            line-height: 1;
        }

        .lightbox-nav:hover {
            opacity: 1;
            background: rgba(255, 255, 255, 0.22);
        }

        .lightbox-prev { left: 16px; }
        .lightbox-next { right: 16px; }

        .lightbox-contador {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.65);
            font-size: 0.88rem;
            font-family: var(--fuente-cuerpo);
        }

        /* ---- Responsive ---- */
        @media (max-width: 768px) {
            .galeria-hero {
                padding: 52px 20px 44px;
            }

            .galeria-contenido {
                padding: 40px 12px;
            }

            .galeria-grid {
                columns: 2 140px;
                column-gap: 8px;
            }

            .galeria-item {
                margin-bottom: 8px;
            }

            .lightbox-nav {
                padding: 10px 14px;
                font-size: 1.5rem;
            }

            .lightbox-prev { left: 8px; }
            .lightbox-next { right: 8px; }
        }

    </style>
</head>

<body>

        <div class="logo">
            <a href="index.html">

    <main>

        <!-- GALERÍA -->
        <div class="galeria-contenido">

    <!-- LIGHTBOX -->

        <button class="lightbox-cerrar" id="lightboxCerrar" aria-label="Cerrar">&times;</button>
        <button class="lightbox-nav lightbox-prev" id="lightboxPrev" aria-label="Foto anterior">&#8249;</button>
        <img class="lightbox-img" id="lightboxImg" src="" alt="Foto ampliada">
        <button class="lightbox-nav lightbox-next" id="lightboxNext" aria-label="Foto siguiente">&#8250;</button>
        <span class="lightbox-contador" id="lightboxContador" aria-live="polite"></span>

    <script>
        /* ============================================================
           GALERÍA — generación de items y lightbox
           ============================================================ */

        const TOTAL_FOTOS = 131;
        const grid        = document.getElementById('galeriaGrid');
        const lightbox    = document.getElementById('lightbox');
        const lbImg       = document.getElementById('lightboxImg');
        const lbContador  = document.getElementById('lightboxContador');
        let   indiceActual = 0;

        /* ---- Generar items de la galería ---- */
        for (let i = 1; i <= TOTAL_FOTOS; i++) {
            const item = document.createElement('div');
            item.className = 'galeria-item';
            item.setAttribute('role', 'listitem');
            item.dataset.indice = i - 1;

            const img = document.createElement('img');
            img.src     = `img/foto${i}.jpg`;
            img.alt     = `Foto de gestión ${i}`;
            img.loading = 'lazy'; /* carga diferida — clave para el rendimiento */

            item.appendChild(img);
            item.addEventListener('click', () => abrirLightbox(i - 1));
            grid.appendChild(item);
        }

        /* ---- Lightbox: abrir ---- */
        function abrirLightbox(indice) {
            indiceActual = indice;
            actualizarLightbox();
            lightbox.classList.add('activo');
            document.body.style.overflow = 'hidden';
        }

        /* ---- Lightbox: actualizar imagen y contador ---- */
        function actualizarLightbox() {
            const n = indiceActual + 1;
            lbImg.src = `img/foto${n}.jpg`;
            lbImg.alt = `Foto de gestión ${n}`;
            lbContador.textContent = `${n} / ${TOTAL_FOTOS}`;
        }

        /* ---- Lightbox: cerrar ---- */
        function cerrarLightbox() {
            lightbox.classList.remove('activo');
            document.body.style.overflow = '';
            lbImg.src = '';
        }

        /* ---- Lightbox: navegar ---- */
        function navegar(direccion) {
            indiceActual = (indiceActual + direccion + TOTAL_FOTOS) % TOTAL_FOTOS;
            actualizarLightbox();
        }

        /* ---- Eventos ---- */
        document.getElementById('lightboxCerrar').addEventListener('click', cerrarLightbox);
        document.getElementById('lightboxPrev').addEventListener('click', () => navegar(-1));
        document.getElementById('lightboxNext').addEventListener('click', () => navegar(1));

        /* Cerrar al hacer click fuera de la imagen */
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) cerrarLightbox();
        });

        /* Navegación con teclado */
        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('activo')) return;
            if (e.key === 'ArrowLeft')  navegar(-1);
            if (e.key === 'ArrowRight') navegar(1);
            if (e.key === 'Escape')     cerrarLightbox();
        });
    </script>

</body>
