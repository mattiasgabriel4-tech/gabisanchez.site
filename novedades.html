<div class="novedades-contenido">

    <!-- PANEL DE CONTROL -->
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;">

        <input id="buscador"
            placeholder="Buscar novedades..."
            style="flex:1;min-width:200px;padding:10px;border-radius:8px;border:1px solid #ddd;">

        <select id="filtroCategoria"
            style="padding:10px;border-radius:8px;border:1px solid #ddd;">
            <option value="TODAS">Todas</option>
            <option value="HCD">HCD</option>
            <option value="GESTION">Gestión</option>
            <option value="ACTIVIDAD">Actividad</option>
        </select>

    </div>

    <!-- LISTADO -->
    <div id="contenedorNovedades"></div>

</div>

<script src="js/novedades.js"></script>

<script>
const contenedor = document.getElementById("contenedorNovedades");
const buscador = document.getElementById("buscador");
const filtroCategoria = document.getElementById("filtroCategoria");

function render(lista) {

    contenedor.innerHTML = "";

    if (!lista.length) {
        contenedor.innerHTML = `
            <div class="novedades-vacio">
                <span class="icono">📰</span>
                <h3>No hay resultados</h3>
                <p>Probá con otro filtro o búsqueda.</p>
            </div>
        `;
        return;
    }

    lista.forEach(n => {

        contenedor.innerHTML += `
            <article class="novedad">

                <div class="novedad-meta">
                    <span class="novedad-fecha">${n.fechaTexto}</span>
                    <span class="novedad-categoria cat-hcd">${n.categoria}</span>
                </div>

                <h2>${n.titulo}</h2>

                <p>${n.bajada}</p>

                ${n.imagen ? `<img src="${n.imagen}" alt="${n.titulo}">` : ""}

                <a href="${n.link}" style="display:inline-block;margin-top:12px;color:#2b5cff;font-weight:600;">
                    Leer nota completa →
                </a>

            </article>
        `;
    });
}

function filtrar() {

    let texto = buscador.value.toLowerCase();
    let cat = filtroCategoria.value;

    let filtrado = novedades.filter(n => {

        let matchTexto =
            n.titulo.toLowerCase().includes(texto) ||
            n.bajada.toLowerCase().includes(texto);

        let matchCat = (cat === "TODAS") || (n.categoria === cat);

        return matchTexto && matchCat;
    });

    render(filtrado);
}

buscador.addEventListener("input", filtrar);
filtroCategoria.addEventListener("change", filtrar);

render(novedades);
</script>
